[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "generator-service-copilot"
version = "0.1.0"
description = "Local decision support for generator service workflows"
requires-python = ">=3.12"
dependencies = [
  "huggingface-hub>=0.28,<2",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<3",
  "pandera[pandas]>=0.23,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
prepare-data = "generator_service_copilot.data:main"
download-mvtec = "generator_service_copilot.download:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
where = ["src"]
