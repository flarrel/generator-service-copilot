[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "generator-service-copilot"
version = "0.1.0"
description = "Local decision support for generator service workflows"
requires-python = ">=3.12"
dependencies = [
  "huggingface-hub>=0.28,<2",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "openai>=2.8,<3",
  "pandas>=2.2,<3",
  "pandera[pandas]>=0.23,<1",
  "redis>=6.2,<8",
  "scikit-learn>=1.6,<2",
  "sentence-transformers>=5,<6",
  "torchvision>=0.29,<0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
prepare-data = "generator_service_copilot.data:main"
download-mvtec = "generator_service_copilot.download:main"
train-nlp = "generator_service_copilot.nlp:main"
train-vision = "generator_service_copilot.vision:main"
evaluate-prompts = "generator_service_copilot.prompts:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
where = ["src"]
